<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- A single element cannot carry both charset and name: the browser reads
         the charset and discards the viewport declaration, which is why the
         page could be zoomed and scrolled on phones.
         viewport-fit=cover lets the layout extend into the safe areas, which
         are then handled with env(safe-area-inset-*) in CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/tennis-tournament-finder/images/splash-13pro.png" />

    <link rel="canonical" href="https://timoknapp.github.io/tennis-tournament-finder/" />
    <link rel="manifest" href="/tennis-tournament-finder/manifest.json">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"

    crossorigin=""/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js" integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ==" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <title>LK-Turnier Finder</title>

    <script>
        // Service worker registration.
        //
        // This used to ask before applying an update: the new worker stayed in
        // its waiting state behind a "Update verfügbar? Jetzt / Später" dialog.
        // Two problems with that. A tournament finder has no unsaved work to
        // protect, so the prompt bought nothing and left people on an old build
        // until they happened to answer it. And answering it did not reliably
        // work: updateApp() reloaded immediately, before the new worker had
        // taken control, so the reload was still served by the old one and the
        // page came back unchanged. Tapping "Jetzt" appeared to do nothing.
        //
        // Updates are now adopted silently. The page reloads once, when the new
        // worker actually takes control.
        if ('serviceWorker' in navigator) {
            // Whether a worker was already in charge when the page loaded. On a
            // first-ever visit there is none, and the worker that installs then
            // claims the page immediately: reloading for that would refresh a
            // page the user just opened, for no benefit.
            const hadController = !!navigator.serviceWorker.controller;

            // A reload guard: controllerchange fires again after the reload,
            // and without this the page would refresh in a loop.
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing || !hadController) {
                    return;
                }
                refreshing = true;
                window.location.reload();
            });

            navigator.serviceWorker.register('service-worker.js')
                .then(registration => {
                    // Adopt a worker that installed during an earlier visit and
                    // is still waiting.
                    if (registration.waiting && navigator.serviceWorker.controller) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }

                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (!newWorker) {
                            return;
                        }

                        newWorker.addEventListener('statechange', () => {
                            // controller is null on a first-ever visit; there is
                            // nothing to replace then, and skipping waiting would
                            // reload a page the user just opened.
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    // Pick up deploys without needing a cold start.
                    setInterval(() => registration.update(), 60000);
                })
                .catch(error => console.log('SW registration failed:', error));
        }
    </script> 
</head>
<body>
    <div class="sideBar">
        <div class="sideBarElement title">
            🎾 LK-Turnier Finder
            <button id="filterToggle" class="filterToggleBtn" onclick="toggleFilters()">Filter ⚙️</button>
        </div>
        <div class="sideBarElement filter" id="filterContainer">
            <!-- Only shown when the panel acts as a sheet on phones. The old
                 toggle lives in the title row, which is off-screen behind the
                 sheet, so the sheet needs its own way out. -->
            <div class="sheetHead">
                <span class="sheetTitle">Filter</span>
                <button type="button" class="sheetDone" onclick="toggleFilters()">Fertig</button>
            </div>
            <form name="searchForm" action="javascript:getTournamentsByDate(dateFrom.value, dateTo.value, compType.value, getSelectedFederations(), playerLK.value)">
                <div class="filterContainer">
                    <label for="dateFrom">Zeitraum von:</label>
                    <input class="filterElement" type="date" id="dateFrom" name="dateFrom">
                </div>
                <div class="filterContainer">
                    <label for="dateTo">Zeitraum bis:</label>
                    <input class="filterElement" type="date" id="dateTo" name="dateTo">
                </div>
                <div class="filterContainer">
                    <label for="compType">Konkurrenzen:</label>
                    <select class="filterElement" id="compType" name="compType">
                        <option value="">Alle Konkurrenzen</option>
                        <option value="Herren+Einzel">Herren Einzel</option>
                        <option value="Herren+Doppel">Herren Doppel</option>
                        <option value="Damen+Einzel">Damen Einzel</option>
                        <option value="Damen+Doppel">Damen Doppel</option>
                        <option value="Senioren+Einzel">Senioren Einzel</option>
                        <option value="Senioren+Doppel">Senioren Doppel</option>
                        <option value="Jugend+Einzel">Jugend Einzel</option>
                        <option value="Jugend+Doppel">Jugend Doppel</option>
                    </select>
                </div>
                <div class="filterContainer">
                    <label for="playerLK">Meine LK:</label>
                    <!-- Deliberately type="text" rather than type="number": a number
                         input rejects the comma German users type for decimals,
                         and inputmode still brings up a numeric keyboard. -->
                    <input class="filterElement" type="text" id="playerLK" name="playerLK"
                           inputmode="decimal" pattern="[0-9]{1,2}([.,][0-9])?"
                           placeholder="z.B. 12,5" maxlength="5"
                           aria-describedby="playerLKHint">
                    <small id="playerLKHint" class="filterHint">
                        Zeigt nur Konkurrenzen, für die deine LK zugelassen ist (1–25).
                    </small>
                </div>
                <div class="filterContainer">
                    <div class="federationHeader">
                        <label id="federationLabel">Tennisverbände:</label>
                        <div class="federationActions">
                            <button type="button" class="linkBtn" onclick="selectAllFederations()">Alle</button>
                            <span class="separator" aria-hidden="true">|</span>
                            <button type="button" class="linkBtn" onclick="deselectAllFederations()">Keine</button>
                        </div>
                    </div>
                    <div class="federationCheckboxes" role="group" aria-labelledby="federationLabel">
                        <label class="checkboxLabel" title="Badischer Tennisverband">
                            <input type="checkbox" name="federations" value="BAD" checked> BAD
                        </label>
                        <label class="checkboxLabel" title="Bayerischer Tennis-Verband">
                            <input type="checkbox" name="federations" value="BTV"> BTV
                        </label>
                        <label class="checkboxLabel" title="Hamburger Tennisverband">
                            <input type="checkbox" name="federations" value="HAM"> HAM
                        </label>
                        <label class="checkboxLabel" title="Hessischer Tennisverband">
                            <input type="checkbox" name="federations" value="HTV" checked> HTV
                        </label>
                        <label class="checkboxLabel" title="Rheinland-Pfälzischer Tennisverband">
                            <input type="checkbox" name="federations" value="RLP"> RLP
                        </label>
                        <label class="checkboxLabel" title="Tennisverband Schleswig-Holstein">
                            <input type="checkbox" name="federations" value="SLH"> SLH
                        </label>
                        <label class="checkboxLabel" title="Saarländischer Tennisbund">
                            <input type="checkbox" name="federations" value="STB"> STB
                        </label>
                        <label class="checkboxLabel" title="Sächsischer Tennisverband">
                            <input type="checkbox" name="federations" value="STV"> STV
                        </label>
                        <label class="checkboxLabel" title="Tennisverband Mecklenburg-Vorpommern">
                            <input type="checkbox" name="federations" value="TMV"> TMV
                        </label>
                        <label class="checkboxLabel" title="Tennisverband Niedersachsen-Bremen">
                            <input type="checkbox" name="federations" value="TNB"> TNB
                        </label>
                        <label class="checkboxLabel" title="Tennisverband Sachsen-Anhalt">
                            <input type="checkbox" name="federations" value="TSA"> TSA
                        </label>
                        <label class="checkboxLabel" title="Thüringer Tennis-Verband">
                            <input type="checkbox" name="federations" value="TTV"> TTV
                        </label>
                        <label class="checkboxLabel" title="Tennis-Verband Berlin-Brandenburg">
                            <input type="checkbox" name="federations" value="TVBB"> TVBB
                        </label>
                        <label class="checkboxLabel" title="Tennisverband Mittelrhein">
                            <input type="checkbox" name="federations" value="TVM"> TVM
                        </label>
                        <label class="checkboxLabel" title="Tennis-Verband Niederrhein">
                            <input type="checkbox" name="federations" value="TVN"> TVN
                        </label>
                        <label class="checkboxLabel" title="Württembergischer Tennisbund">
                            <input type="checkbox" name="federations" value="WTB" checked> WTB
                        </label>
                        <label class="checkboxLabel" title="Westfälischer Tennis-Verband">
                            <input type="checkbox" name="federations" value="WTV"> WTV
                        </label>
                    </div>
                    <small id="federationCount" class="filterHint" aria-live="polite"></small>
                </div>
                <div class="filterContainer submitContainer">
                    <input class="submitBtn" type="submit" value="Suchen">
                </div>
            </form>
        </div>
    </div>
    <div id="dataNotice" class="data-notice" role="status" aria-live="polite" style="display: none;"></div>

    <!-- The two views of the same results. On phones this becomes a bottom tab
         bar; on wider screens it stays the small toggle in the corner. It is a
         real tablist so assistive technology announces it as navigation. -->
    <div class="viewToggle" role="tablist" aria-label="Ansicht wählen">
        <button type="button" id="viewMapBtn" class="viewToggleBtn active" role="tab"
                onclick="setView('map')" aria-pressed="true" aria-selected="true">
            <svg class="tabIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/>
            </svg>
            <span>Karte</span>
        </button>
        <button type="button" id="viewListBtn" class="viewToggleBtn" role="tab"
                onclick="setView('list')" aria-pressed="false" aria-selected="false">
            <svg class="tabIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
            </svg>
            <span>Liste</span>
        </button>
    </div>

    <!-- Filtering is an action applied to the current view, not a third place
         to be, so it sits outside the tab bar. Hidden on desktop, where the
         panel is always visible anyway. -->
    <button type="button" id="filterFab" class="filterFab" onclick="toggleFilters()"
            aria-controls="filterContainer" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18M6 12h12M10 19h4"/>
        </svg>
        <span>Filter</span>
        <span class="filterFabCount" id="filterFabCount">3</span>
    </button>

    <!-- Dims the map while the filter sheet is open and gives a tap target for
         dismissing it. -->
    <div class="sheetScrim" id="sheetScrim" onclick="toggleFilters()" hidden></div>

    <div id="map">
        <div id="loading" class="loading">Loading&#8230;</div>
    </div>

    <section id="listView" class="list-view" style="display: none;" aria-labelledby="listViewHeading">
        <h2 id="listViewHeading" class="visually-hidden">Turnierliste</h2>

        <div class="list-controls">
            <label for="listSort">Sortieren nach:</label>
            <select id="listSort" onchange="renderTournamentList()">
                <option value="date">Datum</option>
                <option value="title">Titel</option>
                <option value="organizer">Veranstalter</option>
            </select>
            <span id="listCount" class="list-count" aria-live="polite"></span>
        </div>

        <ul id="tournamentList" class="tournament-list"></ul>
        <p id="listEmpty" class="list-empty" style="display: none;">
            Keine Turniere gefunden. Bitte Filter anpassen und erneut suchen.
        </p>
    </section>
    
        <script src="script/main.js"></script>
    <script src="script/mobile-gesture.js"></script>
</body>
</html>
